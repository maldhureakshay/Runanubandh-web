<!DOCTYPE html>
<html>

<head>
  <!-- Redirect Android devices to Play Store -->
  <script>
    if (/android/i.test(navigator.userAgent || navigator.vendor || window.opera)) {
        window.location.replace("https://play.google.com/store/apps/details?id=com.malsoft.runanu_bandh");
    }
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mali Runanubandh">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#AA336A">
  <meta name="apple-mobile-web-app-title" content="Mali Runanubandh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Mali Runanubandh</title>
  <link rel="manifest" href="manifest.json">
  <!-- Google Fonts for landing page -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- Cropper.js for image_cropper_for_web -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">

  <!-- Razorpay for Web Payments -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    html, body {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #AA336A; /* Use app theme color to prevent white overscroll masks */
      overscroll-behavior: none;
      overscroll-behavior-x: none;
    }

    /* Prevent Safari swipe-to-navigate on the Flutter canvas container */
    flt-glass-pane,
    flt-semantics-host,
    flutter-view {
      touch-action: pan-y pinch-zoom;
      overscroll-behavior-x: none;
    }

    .loading-spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #AA336A;
      /* App's primary color */
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -20px;
      margin-left: -20px;
      z-index: -1;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Desktop Landing Page Styles */
    #desktop-landing {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      background: linear-gradient(135deg, #0f0c29, #302b63, #AA336A);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: white;
      font-family: 'Outfit', -apple-system, sans-serif;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10000;
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .landing-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 32px;
      padding: 60px 40px;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
      transform: translateY(20px);
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }

      from {
        transform: translateY(40px);
        opacity: 0;
      }
    }

    .landing-card h1 {
      font-size: 48px;
      font-weight: 800;
      margin: 0 0 16px 0;
      background: linear-gradient(to right, #ffffff, #ffd1e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .landing-card p {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.8);
      margin: 0 0 40px 0;
      line-height: 1.6;
    }

    .store-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .store-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 14px 28px;
      border-radius: 16px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .store-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .store-btn svg {
      width: 28px;
      height: 28px;
    }

    /* iOS PWA Install Prompt Styles */
    #ios-install-prompt {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      padding-bottom: 40px;
      /* Safe area */
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.1);
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      color: #333;
    }

    #ios-install-prompt.visible {
      display: block;
      transform: translateY(0);
    }

    .install-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .install-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      color: #AA336A;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 28px;
      color: #999;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .install-step {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      font-size: 16px;
      line-height: 1.4;
    }

    .install-icon {
      width: 32px;
      height: 32px;
      background: #f0f0f5;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 12px;
      flex-shrink: 0;
      color: #007AFF;
    }

    .install-icon svg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>

<body>
  <!-- Cropper.js script for image_cropper_for_web -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <div class="loading-spinner"></div>
  <script src='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs' type='module'></script>
  <script type='module'>
    var { pdfjsLib } = globalThis;
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

    var pdfRenderOptions = {
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
      cMapPacked: true,
    }
  </script>
  <!-- Desktop Landing Page HTML -->
  <div id="desktop-landing">
    <div class="landing-card">
      <h1>Mali Runanubandh</h1>
      <p>The ultimate community platform is best experienced on mobile. Download our official app to connect, explore,
        and find your perfect match.</p>
      <div class="store-buttons">
        <a href="https://play.google.com/store/apps/details?id=com.malsoft.runanu_bandh" class="store-btn">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M17.523 15.3414L5.59011 22.2536L11.758 12.0674L17.523 15.3414ZM18.8475 14.5428L18.8488 14.5435L21.2828 13.1368C22.2407 12.5833 22.2393 11.4172 21.2828 10.8632L18.8488 9.45656L18.8475 9.45719L12.7239 12.0003L18.8475 14.5428ZM4.01311 21.3283C3.65582 20.9167 3.44434 20.2526 3.44434 19.3444V4.65559C3.44434 3.74737 3.65582 3.08332 4.01311 2.67171L10.7412 11.9796L4.01311 21.3283ZM5.59011 1.74637L17.523 8.65863L11.758 11.9326L5.59011 1.74637Z" />
          </svg>
          Google Play
        </a>
        <a href="#" class="store-btn" onclick="alert('iOS App coming soon!'); return false;">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M16.3263 10.3697C16.3051 8.24354 18.0645 6.94215 18.1517 6.88371C17.0655 5.29177 15.349 5.05041 14.757 5.02324C13.292 4.87119 11.8797 5.89201 11.134 5.89201C10.3882 5.89201 9.2223 5.04574 7.99478 5.06911C6.42531 5.09363 4.96027 5.98665 4.14815 7.4082C2.49306 10.2974 3.72591 14.5663 5.34313 16.9135C6.13112 18.0583 7.05141 19.3491 8.26189 19.3012C9.42907 19.2533 9.87328 18.5492 11.266 18.5492C12.6586 18.5492 13.0601 19.3012 14.2694 19.2778C15.521 19.2533 16.3145 18.1062 17.098 16.9591C18.0063 15.6219 18.384 14.3233 18.4039 14.2544C18.3614 14.238 16.3475 13.4617 16.3263 10.3697ZM13.8821 3.2995C14.5262 2.51866 14.9604 1.44299 14.8423 0.359375C13.9048 0.399081 12.7533 0.989395 12.0878 1.7679C11.4927 2.45879 10.9705 3.5534 11.1099 4.61882C12.1557 4.70059 13.238 4.08034 13.8821 3.2995Z" />
          </svg>
          App Store
        </a>
      </div>
    </div>
  </div>

  <!-- iOS Install Prompt -->
  <div id="ios-install-prompt">
    <div class="install-header">
      <h3 class="install-title">Install App</h3>
      <button class="close-btn"
        onclick="document.getElementById('ios-install-prompt').classList.remove('visible');setTimeout(()=>document.getElementById('ios-install-prompt').style.display='none',400)">&times;</button>
    </div>
    <div class="install-step">
      <div class="install-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
          <polyline points="16 6 12 2 8 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="15"></line>
        </svg>
      </div>
      <span>1. Tap the <strong>Share</strong> button at the bottom of your screen.</span>
    </div>
    <div class="install-step">
      <div class="install-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
      </div>
      <span>2. Scroll down and tap <strong>Add to Home Screen</strong>.</span>
    </div>
  </div>

  <script>
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isAndroid = /android/i.test(navigator.userAgent || navigator.vendor || window.opera);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    // Desktop user => show desktop webpage
    if (!isIOS && !isAndroid) {
      window.location.replace("desktop.html");
    } else {
      // iOS browser => show install prompt
      if (isIOS && !isStandalone) {
        const prompt = document.getElementById('ios-install-prompt');
        prompt.style.display = 'block';

        setTimeout(() => {
          prompt.classList.add('visible');
        }, 100);
      }

      // Load Flutter for Android or iOS standalone
      let script = document.createElement('script');
      script.src = "flutter_bootstrap.js";
      script.async = true;
      document.body.appendChild(script);
    }
  </script>
</body>

</html>
